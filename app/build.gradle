plugins {
    id 'com.android.application'
    //// id 'com.google.gms.google-services'
}

android {
    namespace 'com.aurawalls.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.aurawalls.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ===== API KEYS — Replace with your own =====
        buildConfigField "String", "PEXELS_API_KEY",   '"KQ8bNcNx7MTyhK8HK1Ox0vNv08qr2b6eDZmQ4b6EOx05SnvLhhOwRKRv"'
        buildConfigField "String", "UNSPLASH_API_KEY", '"jn-T6glFXgkV1bLrhWi3C2esUoLouJN4Yx8I-6gQIfY"'
        buildConfigField "String", "PIXABAY_API_KEY",  '"54943998-e240b795d08bba5f86f0b26d0"'
        buildConfigField "String", "ADMOB_APP_ID",     '"ca-app-pub-XXXXXXXXXXXXXXXX~XXXXXXXXXX"'
    }

    lint {
        abortOnError false
    }

    lint {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'androidx.preference:preference:1.2.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Color Palette
    implementation 'androidx.palette:palette:1.0.0'

    // ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    // ML Kit Face Detection
    implementation 'com.google.mlkit:face-detection:16.1.5'
    // ExoPlayer OkHttp
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    // Image Crop
    implementation 'com.github.yalantis:ucrop:2.2.8'
    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    //// implementation platform('com.google.firebase:firebase-bom:32.7.0')
}
